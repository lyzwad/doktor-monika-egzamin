<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!--
    Znak aplikacji Doktor Monika Egzamin — autorski, prosty monogram „DM”.
    Kolory z tokenów Design (PRZEKAZANIE §4): tło --bg #FAFBFC, litery --primary #3C5C7C, akcent --teal #2A7B73.
    Krój: Hanken Grotesk 700 (SIL OFL 1.1, lokalnie z @fontsource/hanken-grotesk) — wstrzykiwany przy rasteryzacji
    (scripts/generate-icons.mjs). Plik jest źródłem ikon PNG; nie trafia do dist.
    Kompozycja mieści się w strefie bezpiecznej ikony maskowalnej (koło o promieniu 40% boku).
  -->
  <title>Doktor Monika Egzamin</title>
  <rect width="512" height="512" fill="#FAFBFC"/>
  <g id="znak">
    <text x="253.9" y="306.5" text-anchor="middle" font-family="'Hanken Grotesk'" font-weight="700" font-size="208" letter-spacing="-4" fill="#3C5C7C">DM</text>
    <rect x="200" y="332.5" width="112" height="18" rx="9" fill="#2A7B73"/>
  </g>
</svg>
