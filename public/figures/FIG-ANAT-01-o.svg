<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 338" width="360" height="338" font-family="Hanken Grotesk, -apple-system, BlinkMacSystemFont, Segoe UI, Helvetica, Arial, sans-serif">
  <title>Płaszczyzna „pod SMAS” i jej sąsiedztwo — schemat objaśniający</title>
  <desc>Ten sam model pięciu warstw: 1 skóra, 2 podskórna tkanka tłuszczowa, 3 SMAS, 4 płaszczyzna głęboka, 5 powięź głęboka. Linia przerywana oznacza płaszczyznę bezpośrednio pod SMAS. Płaszczyzna głęboka obejmuje przestrzenie i więzadła; przestrzenie są potencjalnymi płaszczyznami w sieci włókien, a nie pustymi jamami. Ta sama płaszczyzna „pod SMAS” graniczy z przestrzenią albo z więzadłem, zależnie od okolicy. Więzadło pokazano w uproszczeniu, tylko w obrębie płaszczyzny głębokiej. Model poglądowy, bez skali; relacje różnią się regionalnie i osobniczo.</desc>
  <rect x="0" y="0" width="360" height="338" fill="#FFFFFF"></rect>
  <rect x="16" y="16" width="210" height="30" fill="#F1DDD2"></rect>
  <rect x="16" y="46" width="210" height="50" fill="#FAEFCF"></rect>
  <rect x="16" y="96" width="210" height="28" fill="#E6CFCB"></rect>
  <rect x="16" y="124" width="210" height="40" fill="#F3F5F8"></rect>
  <rect x="16" y="164" width="210" height="32" fill="#D9E0E8"></rect>
  <g fill="none" stroke="#B6C1CC" stroke-width="1">
    <rect x="16" y="16" width="210" height="180"></rect>
    <line x1="16" y1="46" x2="226" y2="46"></line>
    <line x1="16" y1="96" x2="226" y2="96"></line>
    <line x1="16" y1="164" x2="226" y2="164"></line>
  </g>
  <rect x="130" y="122" width="14" height="44" fill="#7F8E9D"></rect>
  <line x1="16" y1="124" x2="226" y2="124" stroke="#1B2632" stroke-width="1.6" stroke-dasharray="6 4"></line>
  <g font-size="12" fill="#1B2632" text-anchor="middle">
    <text x="87" y="141">przestrzeń</text>
    <text x="87" y="156">potencjalna</text>
    <text x="185" y="141">przestrzeń</text>
    <text x="185" y="156">potencjalna</text>
  </g>
  <g font-size="13" font-weight="700" fill="#1B2632" text-anchor="middle">
    <circle cx="34" cy="31" r="10" fill="#FFFFFF" stroke="#B6C1CC"></circle><text x="34" y="35.5">1</text>
    <circle cx="34" cy="71" r="10" fill="#FFFFFF" stroke="#B6C1CC"></circle><text x="34" y="75.5">2</text>
    <circle cx="34" cy="110" r="10" fill="#FFFFFF" stroke="#B6C1CC"></circle><text x="34" y="114.5">3</text>
    <circle cx="34" cy="144" r="10" fill="#FFFFFF" stroke="#B6C1CC"></circle><text x="34" y="148.5">4</text>
    <circle cx="34" cy="180" r="10" fill="#FFFFFF" stroke="#B6C1CC"></circle><text x="34" y="184.5">5</text>
  </g>
  <g font-size="13" fill="#1B2632">
    <text x="234" y="35.5">Skóra</text>
    <text x="234" y="67.5">Podskórna tkanka</text>
    <text x="234" y="82.5">tłuszczowa</text>
    <text x="234" y="114.5">SMAS</text>
    <text x="234" y="140">Płaszczyzna</text>
    <text x="234" y="155">głęboka</text>
    <text x="234" y="184.5">Powięź głęboka</text>
  </g>
  <g font-size="12.5" fill="#1B2632">
    <line x1="16" y1="222" x2="44" y2="222" stroke="#1B2632" stroke-width="1.6" stroke-dasharray="6 4"></line>
    <text x="54" y="226.5">płaszczyzna „pod SMAS”</text>
    <rect x="24" y="236" width="12" height="16" fill="#7F8E9D"></rect>
    <text x="54" y="248.5">więzadło (przebieg uproszczony)</text>
    <text x="16" y="276" font-weight="600">Ta sama płaszczyzna graniczy z przestrzenią</text>
    <text x="16" y="292" font-weight="600">albo z więzadłem — zależnie od okolicy.</text>
  </g>
  <g font-size="12" fill="#586879">
    <text x="16" y="314">Model poglądowy, bez skali; relacje różnią się</text>
    <text x="16" y="329">regionalnie i osobniczo.</text>
  </g>
</svg>

